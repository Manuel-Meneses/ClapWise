<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClapWise Demo - 3G Servicio</title>
    <style>
        body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; background-color: #eae6df; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .mobile-frame { width: 400px; height: 800px; background: #efeae2; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; border: 8px solid #333; }
        .wa-header { background-color: #075e54; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; font-weight: 500; font-size: 18px; }
        .avatar { width: 40px; height: 40px; background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #075e54; font-weight: bold; font-size: 20px; }
        .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        .bubble { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 15px; line-height: 1.4; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .bot { background-color: #ffffff; align-self: flex-start; border-top-left-radius: 0; }
        .user { background-color: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; }
        .input-area { background-color: #f0f0f0; padding: 15px; display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 12px 20px; border: none; border-radius: 30px; outline: none; font-size: 15px; }
        button { background-color: #128c7e; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .timestamp { font-size: 10px; color: #999; text-align: right; margin-top: 5px; }
    </style>
</head>
<body>

<div class="mobile-frame">
    <div class="wa-header">
        <div class="avatar">3G</div> 
        <div>
            <div>Asistente 3G Servicio</div>
            <div style="font-size: 12px; font-weight: normal; opacity: 0.8;">en línea</div>
        </div>
    </div>
    
    <div class="chat-area" id="chat">
        <!-- El saludo inicial adaptado -->
        <div class="bubble bot">
            ¡Hola! Soy el asistente virtual de 3G Servicio Técnico. ¿Se te rompió el celu o andabas buscando algún equipo? 🚀
            <div class="timestamp">Ahora</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="mensaje" placeholder="Escribe un mensaje" onkeypress="if(event.key === 'Enter') enviarMensaje()">
        <button onclick="enviarMensaje()">➤</button>
    </div>
</div>

<script>
    // AHORA SÍ: Apuntamos al cerebro de Joa en la base de datos
    const CLIENT_ID = "3g_servicio"; 

    function agregarBurbuja(texto, tipo) {
        const chat = document.getElementById('chat');
        const hora = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const div = document.createElement('div');
        div.className = `bubble ${tipo}`;
        div.innerHTML = `${texto} <div class="timestamp">${hora}</div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    async function enviarMensaje() {
        const input = document.getElementById('mensaje');
        const texto = input.value.trim();
        if (!texto) return;

        agregarBurbuja(texto, 'user');
        input.value = '';

        const typingBubble = agregarBurbuja("Escribiendo...", 'bot');

        try {
            const response = await fetch('http://localhost:8000/webhook/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    client_id: CLIENT_ID,
                    numero_telefono: "cliente_nuevo_002",
                    texto: texto
                })
            });
            const data = await response.json();
            typingBubble.innerHTML = `${data.respuesta_bot} <div class="timestamp">Ahora</div>`;
        } catch (error) {
            typingBubble.innerHTML = "❌ Error conectando con el cerebro de ClapWise. (¿El servidor está encendido?)";
        }
    }
</script>
</body>
</html>
